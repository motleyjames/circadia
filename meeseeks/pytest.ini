[pytest]
# Meeseeks Golden Testing Suite Configuration

# Test discovery
# The harness's own suite. This pointed at a bare `tests` directory that
# has never existed, so `pytest` from here collected nothing and exited 4.
testpaths = tools_core/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output settings
# Quiet by default: 114 tests with -v and live logs is hundreds of lines for a
# run whose only interesting output is the last one. Ask for detail when you
# want it:  pytest -v --log-cli-level=INFO
addopts =
    --tb=short
    --strict-markers

# Markers
markers =
    smoke: Quick smoke tests that should always pass
    golden: Golden tests that verify core functionality
    integration: Integration tests that may call real APIs
    slow: Marks tests as slow (deselect with '-m "not slow"')
    scripts: Tests for tools_core/scripts utilities
    requires_openai: Tests that require OpenAI API key
    requires_anthropic: Tests that require Anthropic API key
    requires_google: Tests that require Google API key
    requires_any_llm: Tests that require at least one LLM provider
    requires_mermaid: Tests that require mermaid-cli (mmdc) or npx

# Logging
log_cli = false
log_cli_level = INFO

# Timeout for tests (in seconds)
# Uncomment if you have pytest-timeout installed
# timeout = 60

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
