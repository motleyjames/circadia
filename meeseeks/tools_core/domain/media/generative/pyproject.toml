[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gen-media"
version = "0.1.0"
description = "Unified Python SDK for local image generation (ComfyUI, MFLUX, Z-Image, Draw Things)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Legion OS", email = "dev@legionos.local" }
]
keywords = ["image-generation", "comfyui", "flux", "mflux", "z-image", "draw-things", "ai", "diffusion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.25",
    "Pillow>=10.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mflux = [
    "mflux>=0.4",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]
all = [
    "gen-media[mflux,dev]",
]

[project.urls]
Homepage = "https://github.com/legionos/gen-media"
Documentation = "https://github.com/legionos/gen-media#readme"
Repository = "https://github.com/legionos/gen-media"

[tool.hatch.build.targets.wheel]
packages = ["src/gen_media"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

